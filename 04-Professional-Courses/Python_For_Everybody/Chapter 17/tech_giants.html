<html>

<head>
       <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
       <title>AI Revolution: Global Tech Giants Map</title>
       <link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.1/dist/leaflet.css" />
       <script src="https://unpkg.com/leaflet@1.3.1/dist/leaflet.js"></script>

       <script src="tech_giants.js"></script>

       <style>
              
              .pulse {
                     width: 10px;
                     height: 10px;
                     border: 5px solid #ff4d4d;
                     border-radius: 30px;
                     background: #ff4d4d;
                     animation: pulse 2s infinite;
              }
       
              @keyframes pulse {
                     0% {
                            box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.4);
                     }
       
                     70% {
                            box-shadow: 0 0 0 10px rgba(255, 77, 77, 0);
                     }
       
                     100% {
                            box-shadow: 0 0 0 0 rgba(255, 77, 77, 0);
                     }
              }  </style>
</head>

<body>

       <div id="map" style="width: 100%; height: 100%;"></div>

       <div id="stats-box" style="position: absolute; top: 20px; right: 20px; z-index: 1000; 
              background: rgba(0, 0, 0, 0.8); color: white; padding: 15px; border-radius: 10px; 
              border: 1px solid #ff4d4d; font-family: sans-serif; min-width: 150px;">
              <h4 style="margin: 0 0 10px 0; color: #ff4d4d;">AI Power Stats</h4>
              <div id="stats-content">
                     Processing giants...
              </div>
              </div>










       <script type="text/javascript">
              
                     var count = myData.length;
                     var html = "<b>Total Giants:</b> " + count + "<br>";
                     html += "<b>Focus:</b> AI & Semiconductors<br>";
                     document.getElementById('stats-content').innerHTML = html;
              
              var map = L.map('map').setView([30.0, 31.0], 2);
              L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                     attribution: '&copy; OpenStreetMap &copy; CARTO'
              }).addTo(map);

              
              var techIcon = L.icon({
                     iconUrl: 'https://cdn-icons-png.flaticon.com/512/900/900618.png',
                     iconSize: [32, 32],
                     iconAnchor: [16, 32],
                     popupAnchor: [0, -32],
                     className: 'pulse' 
              });

              
              for (var i = 0; i < myData.length; i++) {
                     var row = myData[i];
                     L.marker([row[0], row[1]], { icon: techIcon }).addTo(map)
                     .bindPopup("<b style='color:#ff4d4d;'>" + row[2] + "</b><br><a href='https://www.google.com/search?q=" + row[2] + "' target='_blank' style='color:#add8e6;'>Search for Info</a>");
              }
        </script>
       </script>
       <div style="padding: 10px;">
              <hr>
              <h3>Project: Geospatial Analysis of Tech Giants</h3>
              <p>Mapping the leaders of the AI Revolution.</p>
              <p>Generated at: <span id="clock"></span></p>
       </div>
       
       <script>
              document.getElementById('clock').innerHTML = new Date().toLocaleString();
        </script>
     

</body>

</html>
